name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync environment
        run: uv sync --locked --dev

      - name: Stage web assets
        run: make stage-web

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Check frozen experiment catalogue
        run: uv run python scripts/freeze_experiment_catalogue.py --check

      - name: Native and scientific tests
        run: uv run pytest -q --ignore=tests/e2e --junitxml=artifacts/local/acceptance/ci_native.xml

      - name: Install browser
        run: uv run playwright install --with-deps chromium

      - name: Browser behavior and native-Pyodide parity
        run: uv run pytest -q tests/e2e --junitxml=artifacts/local/acceptance/ci_browser.xml

      - name: Build and reproduce from a fresh locked wheel
        run: make experiments-install-check

      - name: Preserve validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.sha }}
          path: artifacts/local/acceptance/
          if-no-files-found: warn
